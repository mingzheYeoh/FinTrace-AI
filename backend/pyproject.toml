[project]
name = "fintrace-backend"
version = "0.1.0"
description = "Synthetic, fixture-backed FinTrace AI Phase 1A API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "openapi-spec-validator>=0.7.2,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "openapi_spec_validator", "jsonschema.*"]
ignore_missing_imports = true
